# Example YAML configuration for TARDIS
tardis_config_version: v1.0

supernova:
  luminosity_requested: 9.44 log_lsun
  time_explosion: 8.9 day

atom_data: kurucz_cd23_chianti_H_He.h5

model:
  structure:
    type: specific
    velocity:
      start: 1.1e4 km/s
      stop: 20000 km/s
      num: 20
    density:
      type: branch85_w7

  abundances:
    type: uniform
    O: 0.3
    Fe: 0.4
    Si: 0.3

plasma:
  disable_electron_scattering: no
  ionization: nebular
  excitation: dilute-lte
  radiative_rates_type: dilute-blackbody
  line_interaction_type: macroatom
  initial_t_inner: 10000 K

montecarlo:
  seed: 23111963
  no_of_packets: 1.0e+5
  iterations: 30
  nthreads: 8

  last_no_of_packets: 2.e+5

  convergence_strategy:
    type: damped
    damping_constant: 0.4
    threshold: 0.0005
    fraction: 0.8
    
    t_inner:
      damping_constant: 0.0

spectrum:
  start: 500 angstrom
  stop: 20000 angstrom
  num: 10000
  integrated:
    interpolate_shells: 80
  